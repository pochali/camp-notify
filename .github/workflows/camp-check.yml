name: Camp Availability Check

on:
  schedule:
    # 10分ごと
    - cron: "*/5 * * * *"

  # 手動実行できるようにする
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check CAMP and CABINS
        shell: powershell
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          .\check_nasu.ps1
