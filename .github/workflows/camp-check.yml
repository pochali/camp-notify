name: Camp Availability Check

on:
  # 外部から repository_dispatch で起動
  repository_dispatch:
    types: [camp_availability_check]

  # GitHub画面から手動実行も可能
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check CAMP and CABINS
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          .\check_nasu.ps1
