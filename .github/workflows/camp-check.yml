name: Camp Availability Check

on:
  schedule:
    # 毎時 3, 8, 13, 18, 23...分
    - cron: "3/5 * * * *"

  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check CAMP and CABINS
        shell: powershell
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          .\check_nasu.ps1
